        var parts = window.location.pathname.split('/').filter(Boolean);
        window.__APP_BASE__ = (window.location.hostname.endsWith('.github.io') || parts[0] === 'document-scanner-web') && parts.length ? '/' + parts[0] : '';
        var base = document.createElement('base');
        base.href = (window.__APP_BASE__ || '') + '/';
        document.head.prepend(base);
        var params = new URLSearchParams(window.location.search);
        var redirectedPath = params.get('__route');
        if (redirectedPath) {
          params.delete('__route');
          var query = params.toString();
          var restored = (window.__APP_BASE__ || '') + redirectedPath + (query ? '?' + query : '') + window.location.hash;
          window.history.replaceState(null, '', restored);
        }
      })();
