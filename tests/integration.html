<!doctype html><html><head><meta charset="utf-8"><title>Papertrail browser integration checks</title></head><body>
<h1>Browser integration checks</h1><button id="run">Run checks</button><ol id="results"></ol><div id="root" hidden></div>
<script type="module">
const html=await(await fetch('../index.html?integration='+Date.now(),{cache:'no-store'})).text();
const bundle=html.match(/src="\.\/assets\/(app(?:-[a-f0-9]+)?\.js)"/)[1];
const {renderPage,makePdf,importPdf,writeDocument,readDocuments,removeDocument}=await import('../assets/'+bundle);
const results=document.querySelector('#results');
const assert=(ok,message)=>{if(!ok)throw Error(message);};
async function check(name,fn){const li=document.createElement('li');results.append(li);try{await fn();li.textContent='PASS: '+name;}catch(error){li.textContent='FAIL: '+name+' — '+error.message;}}
document.querySelector('#run').onclick=async()=>{
  results.replaceChildren();
  const canvas=document.createElement('canvas');canvas.width=400;canvas.height=600;const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,400,600);ctx.fillStyle='black';ctx.font='28px sans-serif';ctx.fillText('SCANNER TEST',20,60);ctx.fillStyle='red';ctx.fillRect(20,400,100,100);
  const page={id:'test-page',name:'Test',src:canvas.toDataURL(),rotation:0,brightness:100,contrast:100,filter:'original',crop:{tl:[0,0],tr:[100,0],br:[100,100],bl:[0,100]}};
  await check('Full-image rendering preserves dimensions',async()=>{const result=await renderPage(page);assert(result.width===400&&result.height===600,'dimensions changed');});
  await check('Rotation swaps rendered dimensions',async()=>{const result=await renderPage({...page,rotation:90});assert(result.width===600&&result.height===400,'rotation failed');});
  await check('Perspective crop changes output dimensions',async()=>{const result=await renderPage({...page,crop:{tl:[10,10],tr:[90,10],br:[90,90],bl:[10,90]}});assert(result.width===320&&result.height===480,'crop failed');});
  await check('Invalid crop fails with actionable error',async()=>{try{await renderPage({...page,crop:{tl:[0,0],tr:[0,0],br:[0,0],bl:[0,0]}});throw Error('accepted invalid crop');}catch(e){assert(e.message.includes('Crop corners'),'wrong error');}});
  await check('Watermark changes exported pixels',async()=>{const a=await renderPage(page),b=await renderPage(page,{watermark:'TEST'});assert(a.bytes.length!==b.bytes.length,'no watermark rendered');});
  await check('Ink changes exported pixels',async()=>{const a=await renderPage(page),b=await renderPage({...page,ink:[{color:'#17363a',width:10,points:[[10,50],[90,70]]}]});assert(a.bytes.length!==b.bytes.length,'ink missing');});
  await check('PDF export/import round trip includes two pages',async()=>{const blob=await makePdf({name:'Round trip',pages:[page,{...page,rotation:90}]});const files=await importPdf(new File([blob],'roundtrip.pdf',{type:'application/pdf'}));assert(files.length===2&&files.every(f=>f.size>1000),'PDF import failed');});
  await check('IndexedDB document survives separate read connection',async()=>{const id='integration-'+crypto.randomUUID();try{await writeDocument({id,name:'Disposable test',updatedAt:new Date().toISOString(),pages:[page]});const saved=(await readDocuments()).find(d=>d.id===id);assert(saved?.pages[0].src===page.src,'document not persisted');}finally{await removeDocument(id);}});
};
</script></body></html>
